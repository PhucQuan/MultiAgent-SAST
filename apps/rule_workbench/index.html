<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegis Rule Workbench</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Aegis-SAST</p>
          <h1>Rule Draft</h1>
        </div>
        <p id="status-text" class="status-chip">Loading...</p>
      </header>

      <section class="composer-card">
        <div class="toolbar">
          <label class="toolbar-field toolbar-seed">
            <span>Seed</span>
            <select id="draft-seed-suggestions">
              <option value="">Loading...</option>
            </select>
          </label>

          <label class="toolbar-field">
            <span>Language</span>
            <select id="draft-language"></select>
          </label>

          <label class="toolbar-field">
            <span>Family</span>
            <select id="draft-family"></select>
          </label>
        </div>

        <div id="chat-feed" class="chat-feed"></div>
        <div id="quick-examples" class="quick-examples"></div>

        <form id="draft-form" class="composer-form">
          <textarea
            id="draft-description"
            name="description"
            rows="8"
            placeholder="Python command injection via shell-enabled subprocess.&#10;Sources: request.args.get(), input()&#10;Sinks: subprocess.run(..., shell=True), os.system()&#10;Sanitizers: shlex.quote()"
            required
          ></textarea>

          <div class="composer-actions">
            <span class="composer-hint">Ctrl+Enter to build</span>
            <div class="button-row">
              <button id="clear-draft-button" class="ghost-button" type="button">Clear</button>
              <button id="draft-build-button" type="submit">Build Draft</button>
            </div>
          </div>
        </form>

        <details class="advanced-panel">
          <summary>Advanced</summary>

          <div class="advanced-grid">
            <label>
              <span>Seed path</span>
              <input
                id="draft-seed-input"
                name="seed_input_path"
                type="text"
                placeholder="datasets/synthetic/rule_review_v1/seed_inputs/..."
                required
              />
            </label>

            <label>
              <span>Output dir</span>
              <input
                id="draft-output-dir"
                name="output_dir"
                type="text"
                placeholder="reports/rule_review/my_seed_draft"
              />
            </label>

            <label>
              <span>Profile</span>
              <select id="draft-profile"></select>
            </label>

            <label>
              <span>Title</span>
              <input id="draft-title" name="title" type="text" placeholder="Optional" />
            </label>

            <label>
              <span>Rule id</span>
              <input id="draft-rule-id" name="rule_id" type="text" placeholder="Optional" />
            </label>
          </div>
        </details>
      </section>

      <section class="result-card">
        <div class="result-head">
          <h2>Artifacts</h2>
          <div id="summary-card" class="summary-card empty">No draft yet.</div>
        </div>

        <div id="artifact-tabs" class="artifact-tabs"></div>
        <pre id="artifact-preview" class="artifact-preview">No artifact selected.</pre>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
