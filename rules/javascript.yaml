# Default Security Rules for JavaScript/Node.js Analysis

sources:
  # Express/HTTP Request Parameters
  - pattern: "req.query"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "req.body"
    type: "HTTP_BODY"
    severity: "HIGH"
  - pattern: "req.params"
    type: "HTTP_PARAMS"
    severity: "HIGH"
  - pattern: "req.headers"
    type: "HTTP_HEADERS"
    severity: "MEDIUM"
  - pattern: "request.query"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "request.body"
    type: "HTTP_BODY"
    severity: "HIGH"
  
  # User Input from Browser
  - pattern: "process.argv"
    type: "COMMAND_LINE_ARGS"
    severity: "MEDIUM"

sinks:
  sqli:
    - pattern: ".query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Raw SQL query execution"
    - pattern: ".execute("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "SQL query execution via ORM"
    - pattern: "sequelize.query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Sequelize raw query"

  rce:
    - pattern: "exec("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Shell command execution via child_process.exec"
    - pattern: "execSync("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Synchronous shell command execution"
    - pattern: "spawn("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Process spawning via child_process.spawn"
    - pattern: "eval("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Dynamic JavaScript evaluation"
    - pattern: "Function("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Dynamic function constructor"
    - pattern: "vm.runInNewContext("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Node.js VM code execution"

  path_traversal:
    - pattern: "fs.readFile("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File read with potentially malicious path"
    - pattern: "fs.readFileSync("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Synchronous file read"
    - pattern: "path.join("
      type: "PATH_TRAVERSAL"
      severity: "MEDIUM"
      description: "Path construction"
    - pattern: "fs.createReadStream("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File stream creation"

  xss:
    - pattern: "res.send("
      type: "XSS"
      severity: "HIGH"
      description: "HTTP response potentially containing unescaped user input"
    - pattern: "res.write("
      type: "XSS"
      severity: "HIGH"
      description: "HTTP response write"
    - pattern: "innerHTML"
      type: "XSS"
      severity: "HIGH"
      description: "DOM innerHTML assignment"
    - pattern: "document.write("
      type: "XSS"
      severity: "CRITICAL"
      description: "DOM document.write"

  ssrf:
    - pattern: "axios.get("
      type: "SSRF"
      severity: "HIGH"
      description: "HTTP GET via axios (SSRF risk)"
    - pattern: "axios.post("
      type: "SSRF"
      severity: "HIGH"
      description: "HTTP POST via axios (SSRF risk)"
    - pattern: "fetch("
      type: "SSRF"
      severity: "HIGH"
      description: "Fetch API call (SSRF risk)"
    - pattern: "http.get("
      type: "SSRF"
      severity: "HIGH"
      description: "Node.js HTTP request"
    - pattern: "request("
      type: "SSRF"
      severity: "HIGH"
      description: "npm request library (SSRF risk)"

  nosqli:
    - pattern: ".find("
      type: "NOSQL_INJECTION"
      severity: "CRITICAL"
      description: "MongoDB find without sanitization"
    - pattern: ".findOne("
      type: "NOSQL_INJECTION"
      severity: "CRITICAL"
      description: "MongoDB findOne without sanitization"
    - pattern: ".aggregate("
      type: "NOSQL_INJECTION"
      severity: "HIGH"
      description: "MongoDB aggregation pipeline"

  deserialization:
    - pattern: "JSON.parse("
      type: "INSECURE_DESERIALIZATION"
      severity: "MEDIUM"
      description: "JSON parsing of untrusted data (prototype pollution risk)"
    - pattern: "serialize-javascript"
      type: "INSECURE_DESERIALIZATION"
      severity: "HIGH"
      description: "JavaScript serialization"
    - pattern: "node-serialize"
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "node-serialize (known RCE gadget)"

  open_redirect:
    - pattern: "res.redirect("
      type: "OPEN_REDIRECT"
      severity: "MEDIUM"
      description: "Unvalidated redirect"

sanitizers:
  - pattern: "escape("
    mitigates: ["XSS"]
    description: "HTML entity escaping"
  - pattern: "sanitize("
    mitigates: ["XSS", "SQL_INJECTION"]
    description: "Input sanitization"
  - pattern: "parseInt("
    mitigates: ["SQL_INJECTION", "NOSQL_INJECTION"]
    description: "Integer parsing"
  - pattern: "Number("
    mitigates: ["SQL_INJECTION"]
    description: "Number conversion"

safe_patterns:
  - "Number("
  - "parseInt("
  - "parseFloat("
  - "Boolean("
