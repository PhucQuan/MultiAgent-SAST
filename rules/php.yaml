# Default Security Rules for PHP Analysis

sources:
  # PHP Superglobals (Classic attack vectors)
  - pattern: "$_GET"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "$_POST"
    type: "HTTP_POST"
    severity: "HIGH"
  - pattern: "$_REQUEST"
    type: "HTTP_REQUEST"
    severity: "HIGH"
  - pattern: "$_COOKIE"
    type: "HTTP_COOKIE"
    severity: "MEDIUM"
  - pattern: "$_SERVER"
    type: "HTTP_SERVER"
    severity: "MEDIUM"
  - pattern: "$_FILES"
    type: "FILE_UPLOAD"
    severity: "HIGH"
  - pattern: "php://input"
    type: "HTTP_BODY"
    severity: "HIGH"

  # Standard Input
  - pattern: "readline("
    type: "USER_INPUT"
    severity: "MEDIUM"
  - pattern: "fgets(STDIN"
    type: "USER_INPUT"
    severity: "MEDIUM"

sinks:
  sqli:
    - pattern: "mysqli_query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "MySQLi query execution"
    - pattern: "mysql_query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Deprecated MySQL query (critical!)"
    - pattern: "pg_query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "PostgreSQL query execution"
    - pattern: "->query("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "PDO query execution"
    - pattern: "->exec("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "PDO exec execution"

  rce:
    - pattern: "system("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "PHP system() shell command"
    - pattern: "exec("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "PHP exec() command execution"
    - pattern: "shell_exec("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "PHP shell_exec()"
    - pattern: "passthru("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "PHP passthru() command"
    - pattern: "popen("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "PHP popen() process"
    - pattern: "eval("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "PHP eval() code injection"
    - pattern: "preg_replace("
      type: "CODE_INJECTION"
      severity: "HIGH"
      description: "preg_replace with /e modifier - code injection"
    - pattern: "assert("
      type: "CODE_INJECTION"
      severity: "HIGH"
      description: "PHP assert code execution"

  path_traversal:
    - pattern: "include("
      type: "PATH_TRAVERSAL"
      severity: "CRITICAL"
      description: "PHP local file inclusion"
    - pattern: "include_once("
      type: "PATH_TRAVERSAL"
      severity: "CRITICAL"
      description: "PHP local file inclusion"
    - pattern: "require("
      type: "PATH_TRAVERSAL"
      severity: "CRITICAL"
      description: "PHP file inclusion"
    - pattern: "require_once("
      type: "PATH_TRAVERSAL"
      severity: "CRITICAL"
      description: "PHP file inclusion"
    - pattern: "file_get_contents("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File read with user-controlled path"
    - pattern: "fopen("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File open with user path"
    - pattern: "readfile("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Read and output file contents"

  xss:
    - pattern: "echo "
      type: "XSS"
      severity: "HIGH"
      description: "Direct echo of user input = XSS"
    - pattern: "print("
      type: "XSS"
      severity: "HIGH"
      description: "PHP print statement (XSS risk)"
    - pattern: "printf("
      type: "XSS"
      severity: "MEDIUM"
      description: "PHP printf (XSS risk)"

  ssrf:
    - pattern: "file_get_contents("
      type: "SSRF"
      severity: "HIGH"
      description: "PHP file_get_contents can fetch remote URLs (SSRF)"
    - pattern: "curl_exec("
      type: "SSRF"
      severity: "HIGH"
      description: "cURL execution (SSRF risk)"

  xxe:
    - pattern: "simplexml_load_string("
      type: "XXE"
      severity: "HIGH"
      description: "SimpleXML (XXE if external entities not disabled)"
    - pattern: "simplexml_load_file("
      type: "XXE"
      severity: "HIGH"
      description: "SimpleXML file loading"
    - pattern: "DOMDocument->load("
      type: "XXE"
      severity: "HIGH"
      description: "DOMDocument XML loading"

  deserialization:
    - pattern: "unserialize("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "PHP unserialize (Remote Code Execution risk)"

sanitizers:
  - pattern: "mysqli_real_escape_string("
    mitigates: ["SQL_INJECTION"]
    description: "MySQLi string escaping"
  - pattern: "htmlspecialchars("
    mitigates: ["XSS"]
    description: "HTML entity encoding"
  - pattern: "htmlentities("
    mitigates: ["XSS"]
    description: "HTML entity encoding"
  - pattern: "strip_tags("
    mitigates: ["XSS"]
    description: "Strip HTML tags"
  - pattern: "intval("
    mitigates: ["SQL_INJECTION", "NOSQL_INJECTION"]
    description: "Integer cast sanitization"
  - pattern: "filter_input("
    mitigates: ["SQL_INJECTION", "XSS", "PATH_TRAVERSAL"]
    description: "PHP filter_input sanitization"
  - pattern: "filter_var("
    mitigates: ["SQL_INJECTION", "XSS"]
    description: "PHP filter_var sanitization"
  - pattern: "bindParam("
    mitigates: ["SQL_INJECTION"]
    description: "PDO bound parameter (safe)"
  - pattern: "bindValue("
    mitigates: ["SQL_INJECTION"]
    description: "PDO bound value (safe)"

safe_patterns:
  - "intval("
  - "floatval("
  - "boolval("
  - "ctype_digit("
  - "ctype_alpha("
