# Default Security Rules for Java Analysis

sources:
  # Spring / Jakarta Web Inputs
  - pattern: "getParameter("
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "getHeader("
    type: "HTTP_HEADER"
    severity: "MEDIUM"
  - pattern: "getHeaders("
    type: "HTTP_HEADER"
    severity: "MEDIUM"
  - pattern: "getHeaderNames("
    type: "HTTP_HEADER_NAME"
    severity: "MEDIUM"
  - pattern: "getCookies("
    type: "HTTP_COOKIE"
    severity: "MEDIUM"
  - pattern: "getValue("
    type: "HTTP_COOKIE_VALUE"
    severity: "MEDIUM"
  - pattern: "getQueryString("
    type: "HTTP_QUERY"
    severity: "HIGH"
  - pattern: "getInputStream("
    type: "HTTP_BODY"
    severity: "HIGH"
  - pattern: "@RequestParam"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "@RequestBody"
    type: "HTTP_BODY"
    severity: "HIGH"
  - pattern: "@PathVariable"
    type: "HTTP_PATH"
    severity: "HIGH"
  
  # System Arguments
  - pattern: "System.getenv("
    type: "ENVIRONMENT_VAR"
    severity: "LOW"
  - pattern: "args["
    type: "COMMAND_LINE_ARGS"
    severity: "MEDIUM"
  # Scanner Input
  - pattern: "Scanner("
    type: "USER_INPUT"
    severity: "MEDIUM"

sinks:
  sqli:
    - pattern: ".executeQuery("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "PreparedStatement executeQuery (potential SQLi if concatenated)"
    - pattern: ".executeUpdate("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "SQL update execution"
    - pattern: "prepareStatement("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "PreparedStatement created from a dynamic SQL string"
    - pattern: "prepareCall("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "CallableStatement creation from a dynamic SQL string"
    - pattern: "queryForObject("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Spring JDBC queryForObject with dynamic SQL"
    - pattern: "queryForRowSet("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Spring JDBC queryForRowSet with dynamic SQL"
    - pattern: "queryForMap("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Spring JDBC queryForMap with dynamic SQL"
    - pattern: "queryForList("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Spring JDBC queryForList with dynamic SQL"
    - pattern: "batchUpdate("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Spring/JDBC batch update with dynamic SQL"
    - pattern: "createQuery("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "JPA/Hibernate raw query creation"
    - pattern: "nativeQuery"
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "JPA native query (SQLi risk)"

  rce:
    - pattern: "Runtime.exec("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Runtime command execution"
    - pattern: ".exec("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Command execution (Runtime/ProcessBuilder)"
    - pattern: "ProcessBuilder("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Process builder command execution"
    - pattern: ".command("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "ProcessBuilder command assembly from user-controlled arguments"
    - pattern: "ScriptEngine.eval("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Script engine code evaluation"

  path_traversal:
    - pattern: "new File("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File constructor with user input"
    - pattern: "Files.readString("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Read file contents"
    - pattern: "FileInputStream("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File input stream"
    - pattern: "Paths.get("
      type: "PATH_TRAVERSAL"
      severity: "MEDIUM"
      description: "Path construction from user input"

  xss:
    - pattern: "response.getWriter("
      type: "XSS"
      severity: "HIGH"
      description: "HTTP response writer - XSS if user input written unescaped"
    - pattern: ".print("
      type: "XSS"
      severity: "HIGH"
      description: "PrintWriter print (XSS risk if unescaped)"
    - pattern: "getWriter().write("
      type: "XSS"
      severity: "HIGH"
      description: "Direct response write"

  ssrf:
    - pattern: "new URL("
      type: "SSRF"
      severity: "HIGH"
      description: "URL creation from user input (SSRF risk)"
    - pattern: ".openConnection("
      type: "SSRF"
      severity: "HIGH"
      description: "HTTP connection (SSRF risk)"
    - pattern: "RestTemplate.exchange("
      type: "SSRF"
      severity: "HIGH"
      description: "Spring RestTemplate (SSRF risk)"
    - pattern: "HttpClient.send("
      type: "SSRF"
      severity: "HIGH"
      description: "Java HttpClient (SSRF risk)"

  xxe:
    - pattern: "DocumentBuilder.parse("
      type: "XXE"
      severity: "CRITICAL"
      description: "XML Document Builder (XXE risk if features not disabled)"
    - pattern: "SAXParser.parse("
      type: "XXE"
      severity: "CRITICAL"
      description: "SAX Parser (XXE risk)"
    - pattern: "XMLReader.parse("
      type: "XXE"
      severity: "HIGH"
      description: "XML reader parsing"

  deserialization:
    - pattern: "ObjectInputStream.readObject("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "Java object deserialization (Remote Code Execution risk)"
    - pattern: ".readObject("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "Object deserialization"
    - pattern: "XStream.fromXML("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "XStream XML deserialization (RCE risk)"

  open_redirect:
    - pattern: "response.sendRedirect("
      type: "OPEN_REDIRECT"
      severity: "MEDIUM"
      description: "Unvalidated HTTP redirect"

sanitizers:
  - pattern: "ESAPI.encoder()"
    mitigates: ["XSS", "SQL_INJECTION", "PATH_TRAVERSAL"]
    description: "OWASP ESAPI encoding"
  - pattern: "StringEscapeUtils"
    mitigates: ["XSS"]
    description: "Apache Commons HTML escaping"
  - pattern: "Encode.forHtml("
    mitigates: ["XSS"]
    description: "OWASP Java Encoder"
  - pattern: "Integer.parseInt("
    mitigates: ["SQL_INJECTION"]
    description: "Integer cast sanitization"

safe_patterns:
  - "Integer.parseInt("
  - "Long.parseLong("
  - "Double.parseDouble("
