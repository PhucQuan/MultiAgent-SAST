# Default Security Rules for Python Analysis

sources:
  # HTTP Request Parameters
  - pattern: "request.args.get"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "request.args.getlist"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "request.form.get"
    type: "HTTP_FORM"
    severity: "HIGH"
  - pattern: "request.form.getlist"
    type: "HTTP_FORM"
    severity: "HIGH"
  - pattern: "request.cookies.get"
    type: "HTTP_COOKIE"
    severity: "HIGH"
  - pattern: "request.headers.get"
    type: "HTTP_HEADER"
    severity: "HIGH"
  - pattern: "request.headers.getlist"
    type: "HTTP_HEADER"
    severity: "HIGH"
  - pattern: "request.headers.get_all"
    type: "HTTP_HEADER"
    severity: "HIGH"
  - pattern: "request.values.get"
    type: "HTTP_REQUEST"
    severity: "HIGH"
  - pattern: "request.args.keys"
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: "request.form.keys"
    type: "HTTP_FORM"
    severity: "HIGH"
  - pattern: "request.headers.keys"
    type: "HTTP_HEADER"
    severity: "HIGH"
  - pattern: "request.json"
    type: "HTTP_JSON"
    severity: "HIGH"
  - pattern: "request.data"
    type: "HTTP_DATA"
    severity: "HIGH"
  - pattern: ".get_form_parameter("
    type: "HTTP_FORM"
    severity: "HIGH"
  - pattern: ".get_query_parameter("
    type: "HTTP_PARAM"
    severity: "HIGH"
  - pattern: ".get_cookie("
    type: "HTTP_COOKIE"
    severity: "HIGH"
  
  # User Input
  - pattern: "input("
    type: "USER_INPUT"
    severity: "MEDIUM"
  
  # System Arguments
  - pattern: "sys.argv"
    type: "COMMAND_LINE_ARGS"
    severity: "MEDIUM"
  
  # Environment Variables
  - pattern: "os.environ"
    type: "ENVIRONMENT_VAR"
    severity: "LOW"

sinks:
  sqli:
    - pattern: ".execute("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "SQL query execution without parameterization"
    
    - pattern: ".executemany("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Batch SQL execution"
    
    - pattern: ".raw("
      type: "SQL_INJECTION"
      severity: "CRITICAL"
      description: "Raw SQL query (Django ORM)"
  
  rce:
    - pattern: "os.system("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Direct system command execution"
    
    - pattern: "subprocess.call("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Subprocess command execution"
    
    - pattern: "subprocess.run("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Subprocess command execution"
    
    - pattern: "subprocess.Popen("
      type: "COMMAND_INJECTION"
      severity: "CRITICAL"
      description: "Subprocess with shell access"
    
    - pattern: "eval("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Dynamic code evaluation"
    
    - pattern: "exec("
      type: "CODE_INJECTION"
      severity: "CRITICAL"
      description: "Dynamic code execution"
    
    - pattern: "__import__("
      type: "CODE_INJECTION"
      severity: "HIGH"
      description: "Dynamic module import"
  
  path_traversal:
    - pattern: "open("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "File access with potentially malicious path"
    
    - pattern: "pathlib.Path("
      type: "PATH_TRAVERSAL"
      severity: "MEDIUM"
      description: "Path construction - check for directory traversal"

    - pattern: ".exists("
      type: "PATH_TRAVERSAL"
      severity: "MEDIUM"
      description: "Path existence check with potentially malicious path"

    - pattern: ".read_text("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Path read using potentially malicious file path"

    - pattern: ".write_text("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Path write using potentially malicious file path"

    - pattern: ".read_bytes("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Binary path read using potentially malicious file path"

    - pattern: ".write_bytes("
      type: "PATH_TRAVERSAL"
      severity: "HIGH"
      description: "Binary path write using potentially malicious file path"

  xss:
    - pattern: "render_template_string("
      type: "XSS"
      severity: "HIGH"
      description: "Reflected Cross-Site Scripting via template rendering"
    
    - pattern: "Markup("
      type: "XSS"
      severity: "HIGH"
      description: "Bypassing HTML escaping with Markup"

  ssrf:
    - pattern: "requests.get("
      type: "SSRF"
      severity: "HIGH"
      description: "Server-Side Request Forgery via HTTP GET"
      
    - pattern: "urllib.request.urlopen("
      type: "SSRF"
      severity: "HIGH"
      description: "Server-Side Request Forgery via urlopen"

  nosqli:
    - pattern: "collection.find("
      type: "NOSQL_INJECTION"
      severity: "CRITICAL"
      description: "NoSQL DB Query without sanitization"
      
    - pattern: "db.users.find("
      type: "NOSQL_INJECTION"
      severity: "CRITICAL"
      description: "NoSQL DB Query without sanitization"
      
    - pattern: "db.find("
      type: "NOSQL_INJECTION"
      severity: "CRITICAL"
      description: "NoSQL DB Query without sanitization"

  xxe:
    - pattern: "ElementTree.parse("
      type: "XXE"
      severity: "HIGH"
      description: "XML External Entity parsing"
      
    - pattern: "etree.fromstring("
      type: "XXE"
      severity: "HIGH"
      description: "XML External Entity parsing via lxml"

  idor:
    - pattern: "User.query.get("
      type: "IDOR"
      severity: "MEDIUM"
      description: "Insecure Direct Object Reference via explicit DB get"
      
    - pattern: "session.query("
      type: "IDOR"
      severity: "MEDIUM"
      description: "Query execution without ownership check"

  ssti:
    - pattern: "Template("
      type: "SSTI"
      severity: "CRITICAL"
      description: "Server-Side Template Injection via Jinja2 Template"
      
  deserialization:
    - pattern: "pickle.loads("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "Untrusted data deserialization via pickle"
      
    - pattern: "yaml.unsafe_load("
      type: "INSECURE_DESERIALIZATION"
      severity: "CRITICAL"
      description: "Untrusted data deserialization via yaml"
      
    - pattern: "yaml.load("
      type: "INSECURE_DESERIALIZATION"
      severity: "HIGH"
      description: "Potentially unsafe yaml load depending on Loader"

  mass_assignment:
    - pattern: ".update(**"
      type: "MASS_ASSIGNMENT"
      severity: "HIGH"
      description: "Unfiltered mass assignment updating attributes"
      
    - pattern: ".create(**"
      type: "MASS_ASSIGNMENT"
      severity: "HIGH"
      description: "Unfiltered mass assignment creating models"

  open_redirect:
    - pattern: "redirect("
      type: "OPEN_REDIRECT"
      severity: "MEDIUM"
      description: "Unvalidated URL redirection"

sanitizers:
  # SQL Sanitization
  - pattern: "escape_string("
    mitigates: ["SQL_INJECTION"]
    description: "MySQL string escaping"
  
  - pattern: "quote("
    mitigates: ["SQL_INJECTION"]
    description: "SQL identifier quoting"
  
  # Command Injection Sanitization
  - pattern: "shlex.quote("
    mitigates: ["COMMAND_INJECTION"]
    description: "Shell argument escaping"
  
  - pattern: "shlex.split("
    mitigates: ["COMMAND_INJECTION"]
    description: "Safe shell argument parsing"
  
  # Path Traversal Sanitization
  - pattern: "os.path.abspath("
    mitigates: ["PATH_TRAVERSAL"]
    description: "Convert to absolute path"
  
  - pattern: "os.path.realpath("
    mitigates: ["PATH_TRAVERSAL"]
    description: "Resolve symbolic links and normalize"
  
  - pattern: "os.path.normpath("
    mitigates: ["PATH_TRAVERSAL"]
    description: "Normalize path"
  
  # General Sanitization
  - pattern: "html.escape("
    mitigates: ["XSS"]
    description: "HTML entity escaping for untrusted output"

  - pattern: "markupsafe.escape("
    mitigates: ["XSS"]
    description: "MarkupSafe HTML escaping"

  - pattern: "flask.escape("
    mitigates: ["XSS"]
    description: "Flask HTML escaping helper"
  
  - pattern: "re.escape("
    mitigates: []
    description: "Regex special character escaping"

# Safe Patterns (functions that return sanitized data)
safe_patterns:
  - "str.isalnum()"
  - "str.isdigit()"
  - "int("
  - "float("
  - "bool("
