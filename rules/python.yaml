sinks:
  rce:
  - pattern: subprocess.run(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep command injection coverage for subprocess and os
      system calls
  - pattern: subprocess.call(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep command injection coverage for subprocess and os
      system calls
  - pattern: subprocess.Popen(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep command injection coverage for subprocess and os
      system calls
  - pattern: os.system(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep command injection coverage for subprocess and os
      system calls
  - pattern: os.popen(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep command injection coverage for subprocess and os
      system calls
  - pattern: asyncio.create_subprocess_exec(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Detected 'create_subprocess_exec' function with user controlled data.
      You may consider using 'shlex.escape()'.
  - pattern: asyncio.subprocess.create_subprocess_exec(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Detected 'create_subprocess_exec' function with user controlled data.
      You may consider using 'shlex.escape()'.
  - pattern: os.popen2(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Found user-controlled data used in a system call. This could allow
      a malicious actor to execute commands. Use the 'subprocess' module instead,
      which is easier to use without accidentally exposing a command injection vulnerability.
  - pattern: os.popen3(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Found user-controlled data used in a system call. This could allow
      a malicious actor to execute commands. Use the 'subprocess' module instead,
      which is easier to use without accidentally exposing a command injection vulnerability.
  - pattern: os.popen4(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Found user-controlled data used in a system call. This could allow
      a malicious actor to execute commands. Use the 'subprocess' module instead,
      which is easier to use without accidentally exposing a command injection vulnerability.
  - pattern: getattr(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Found user-controlled data used in a system call. This could allow
      a malicious actor to execute commands. Use the 'subprocess' module instead,
      which is easier to use without accidentally exposing a command injection vulnerability.
  - pattern: __import__(
    type: COMMAND_INJECTION
    severity: CRITICAL
    description: Found user-controlled data used in a system call. This could allow
      a malicious actor to execute commands. Use the 'subprocess' module instead,
      which is easier to use without accidentally exposing a command injection vulnerability.
  path_traversal:
  - pattern: open(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Reviewed Semgrep path traversal coverage for real file access sinks
  - pattern: send_file(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Reviewed Semgrep path traversal coverage for real file access sinks
  - pattern: os.remove(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Reviewed Semgrep path traversal coverage for real file access sinks
  - pattern: os.listdir(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Reviewed Semgrep path traversal coverage for real file access sinks
  - pattern: .exists(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Filesystem existence checks using user-controlled paths require validation.
  - pattern: .read_text(
    type: PATH_TRAVERSAL
    severity: HIGH
    description: Reading text from user-controlled paths requires containment validation.
  deserialization:
  - pattern: pickle.load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: pickle.loads(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: _pickle.load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: _pickle.loads(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: cPickle.load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: cPickle.loads(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: dill.load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: dill.loads(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: yaml.load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  - pattern: yaml.unsafe_load(
    type: INSECURE_DESERIALIZATION
    severity: CRITICAL
    description: Reviewed Semgrep insecure deserialization coverage for pickle, dill,
      and yaml loaders
  sqli:
  - pattern: execute(
    type: SQL_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep SQL injection coverage for execute family and raw
      query helpers
  - pattern: executemany(
    type: SQL_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep SQL injection coverage for execute family and raw
      query helpers
  - pattern: raw(
    type: SQL_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep SQL injection coverage for execute family and raw
      query helpers
  - pattern: sqlalchemy.text(
    type: SQL_INJECTION
    severity: CRITICAL
    description: Reviewed Semgrep SQL injection coverage for execute family and raw
      query helpers
  - pattern: 'import mysql

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', (''active''))`'
  - pattern: 'import mysql.cursors

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', (''active''))`'
  - pattern: 'import psycopg2

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', ''active'')`'
  - pattern: 'import pymssql

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', ''active'')`'
  - pattern: 'import pymysql

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', (''active''))`'
  - pattern: 'import pymysql.cursors

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = %s'', (''active''))`'
  - pattern: 'import sqlalchemy

      ...'
    type: SQL_INJECTION
    severity: HIGH
    description: 'Detected SQL statement that is tainted by `event` object. This could
      lead to SQL injection if the variable is user-controlled and not properly sanitized.
      In order to prevent SQL injection, use parameterized queries or prepared statements
      instead. You can use parameterized statements like so: `cursor.execute(''SELECT
      * FROM projects WHERE status = ?'', ''active'')`'
  ssrf:
  - pattern: requests.get(
    type: SSRF
    severity: HIGH
    description: Reviewed Semgrep SSRF coverage for requests.get and urllib.request.urlopen
  - pattern: urllib.request.urlopen(
    type: SSRF
    severity: HIGH
    description: Reviewed Semgrep SSRF coverage for requests.get and urllib.request.urlopen
  xss:
  - pattern: render_template_string(
    type: XSS
    severity: HIGH
    description: Rendering user-controlled template content can execute unsafe HTML.
  - pattern: Markup(
    type: XSS
    severity: HIGH
    description: Marking user-controlled content as trusted HTML can enable XSS.
  - pattern: return "...".format(...)
    type: XSS
    severity: HIGH
    description: Detected Flask route directly returning a formatted string. This
      is subject to cross-site scripting if user input can reach the string. Consider
      using the template engine instead and rendering pages with 'render_template()'.
  - pattern: return "..." % ...
    type: XSS
    severity: HIGH
    description: Detected Flask route directly returning a formatted string. This
      is subject to cross-site scripting if user input can reach the string. Consider
      using the template engine instead and rendering pages with 'render_template()'.
  - pattern: return "..." + ...
    type: XSS
    severity: HIGH
    description: Detected Flask route directly returning a formatted string. This
      is subject to cross-site scripting if user input can reach the string. Consider
      using the template engine instead and rendering pages with 'render_template()'.
  - pattern: return ... + "..."
    type: XSS
    severity: HIGH
    description: Detected Flask route directly returning a formatted string. This
      is subject to cross-site scripting if user input can reach the string. Consider
      using the template engine instead and rendering pages with 'render_template()'.
  - pattern: return f"...{...}..."
    type: XSS
    severity: HIGH
    description: Detected Flask route directly returning a formatted string. This
      is subject to cross-site scripting if user input can reach the string. Consider
      using the template engine instead and rendering pages with 'render_template()'.
  mass_assignment:
  - pattern: .update(**)
    type: MASS_ASSIGNMENT
    severity: HIGH
    description: Merging arbitrary user-controlled keyword fields can overwrite protected attributes.
sanitizers:
- pattern: shlex.quote(
  mitigates:
  - COMMAND_INJECTION
  description: Imported sanitizer from PY-REVIEWED-CORE4-CMD-001
- pattern: os.path.basename(
  mitigates:
  - PATH_TRAVERSAL
  description: Imported sanitizer from PY-REVIEWED-CORE4-PATH-001
- pattern: os.path.abspath(
  mitigates:
  - PATH_TRAVERSAL
  description: Imported sanitizer from PY-REVIEWED-CORE4-PATH-001
- pattern: os.path.realpath(
  mitigates:
  - PATH_TRAVERSAL
  description: Imported sanitizer from PY-REVIEWED-CORE4-PATH-001
- pattern: os.path.normpath(
  mitigates:
  - PATH_TRAVERSAL
  description: Imported sanitizer from PY-REVIEWED-CORE4-PATH-001
- pattern: yaml.safe_load(
  mitigates:
  - INSECURE_DESERIALIZATION
  description: Imported sanitizer from PY-REVIEWED-CORE4-DESER-001
- pattern: int(
  mitigates:
  - SQL_INJECTION
  description: Imported sanitizer from PY-REVIEWED-CORE4-SQLI-001
- pattern: float(
  mitigates:
  - SQL_INJECTION
  description: Imported sanitizer from PY-REVIEWED-CORE4-SQLI-001
- pattern: shlex.split(
  mitigates:
  - COMMAND_INJECTION
  description: Imported sanitizer from dangerous-subprocess-use
- pattern: pipes.quote(
  mitigates:
  - COMMAND_INJECTION
  description: Imported sanitizer from dangerous-subprocess-use
- pattern: html.escape(
  mitigates:
  - XSS
  description: HTML-escapes untrusted content before rendering.
- pattern: markupsafe.escape(
  mitigates:
  - XSS
  description: HTML-escapes untrusted content before rendering.
- pattern: '{...}'
  mitigates:
  - SQL_INJECTION
  description: Imported sanitizer from dynamodb-filter-injection
- pattern: django.utils.html.escape(
  mitigates:
  - XSS
  description: Imported sanitizer from raw-html-format
- pattern: jinja2.escape(
  mitigates:
  - XSS
  description: Imported sanitizer from raw-html-format
- pattern: flask.escape(
  mitigates:
  - XSS
  description: Imported sanitizer from raw-html-format
- pattern: xml.sax.saxutils.escape(
  mitigates:
  - COMMAND_INJECTION
  description: Imported sanitizer from twiml-injection
- pattern: html.escape(
  mitigates:
  - COMMAND_INJECTION
  description: Imported sanitizer from twiml-injection
safe_patterns: []
